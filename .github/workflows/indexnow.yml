name: IndexNow 핑 (네이버)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 바뀐 페이지만 네이버에 알리기
        env:
          KEY: "a1cd0af4d72df0149cf8f7c2beac6c9d"
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          host = open("CNAME").read().strip()
          key = os.environ["KEY"]
          urls = []
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and os.path.exists("sitemap.xml"):
              import re  # 수동 실행: 사이트맵 전체를 알림 (처음 한 번 등)
              urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
              out = ""
          else:
              try:
                  out = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM", "HEAD~1", "HEAD"], text=True)
              except subprocess.CalledProcessError:
                  out = ""
          import re as _re
          norm = lambda b: _re.sub(rb"\?v=[0-9a-zA-Z]+", b"", b)
          for p in out.splitlines():
              if not p.endswith("index.html") or p.startswith((".", "static/")):
                  continue
              try:  # 버전 표시(?v=)만 바뀐 페이지는 빼기
                  old = subprocess.check_output(["git", "show", f"HEAD~1:{p}"], stderr=subprocess.DEVNULL)
                  if norm(old) == norm(open(p, "rb").read()):
                      continue
              except subprocess.CalledProcessError:
                  pass  # 새로 생긴 페이지
              path = p[: -len("index.html")]
              urls.append(f"https://{host}/{path}")
          print(f"바뀐 페이지 {len(urls)}개")
          for i in range(0, len(urls), 10000):
              body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt",
                                 "urlList": urls[i:i + 10000]}).encode()
              req = urllib.request.Request("https://searchadvisor.naver.com/indexnow", data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("네이버 응답", r.status, len(urls[i:i + 10000]), "개")
              except urllib.error.HTTPError as e:
                  print("네이버 응답", e.code, e.read()[:200])
          PY
